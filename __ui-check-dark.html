<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>UI Check (dark)</title>
<link rel="stylesheet" href="styles/main.css?v=2.7.0">
<link rel="stylesheet" href="styles/themes/dark.css">
<link rel="stylesheet" href="scripts/modules/profile/profile.css?v=3.32.0">
<style>
    /* 只為截圖用：把 .profile-overlay 由 fixed 改成局部定位，方便單頁預覽 */
    body { margin: 0; padding: 20px; background: #111; display: flex; }
    .stage { position: relative; width: 440px; height: 956px; flex: 0 0 auto; }
    .stage .profile-overlay {
        position: absolute; inset: 0; padding: 0; border-radius: 44px;
        overflow: hidden; animation: none !important;
    }
    .stage .profile-panel { max-width: none; max-height: none; animation: none !important; }
    .sub-page, .sub-page.is-on { transition: none !important; }
</style>
</head>
<body>
<div class="stage">
    <div class="profile-overlay active">
        <div class="profile-panel">
            <div class="profile-aurora" aria-hidden="true"><span></span><span></span><span></span></div>

            <header class="profile-topbar">
                <button class="profile-close" id="profile-back" type="button" style="display:none;">‹</button>
                <div class="profile-topbar__title" id="profile-topbar-title">儲存空間及數據</div>
                <button class="profile-close" id="profile-close" type="button" style="display:none;">×</button>
            </header>

            <div class="profile-scroll" id="profile-scroll"></div>

            <section class="sub-page is-on" id="profile-subpage" aria-hidden="false">
                <header class="sub-page__nav">
                    <div class="sub-page__nav-row">
                        <button class="back-btn" id="subpage-back" type="button">‹</button>
                        <h1 class="sub-page__title" id="subpage-title">儲存空間及數據</h1>
                        <button class="sub-page__more" id="subpage-more" type="button">•••</button>
                    </div>
                </header>

                <div class="sub-page__body" id="subpage-body">
                    <div class="ios-home">
                        <div class="ios-group-title">用量</div>
                        <section class="ios-card">
                            <div class="ios-list">
                                <div class="detail-stat">
                                    <span class="detail-stat__k">課表資料</span>
                                    <span class="detail-stat__v">2.24 MB</span>
                                </div>
                                <div class="detail-stat">
                                    <span class="detail-stat__k">離線快取頁面</span>
                                    <span class="detail-stat__v">38.6 MB</span>
                                </div>
                                <div class="detail-stat">
                                    <span class="detail-stat__k">這部裝置可用空間</span>
                                    <span class="detail-stat__v">380.90 GB</span>
                                </div>
                            </div>
                        </section>

                        <div class="ios-group-title">管理</div>
                        <section class="ios-card">
                            <div class="ios-list">
                                <button class="detail-action detail-action--danger" type="button">清除快取並重新載入</button>
                            </div>
                        </section>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
</body>
</html>
